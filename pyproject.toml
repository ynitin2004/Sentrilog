[project]
name = "sentrilog"
version = "0.1.0"
description = "KYC/AML Document Intelligence Pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "boto3>=1.35.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "easyocr>=1.7.2",
    "truststore>=0.9.0",
    "temporalio>=1.8.0",
    # Pinned below 1.14: qdrant-client requires its minor version stay within 1 of the
    # Qdrant server's (v1.12.4 in docker-compose.yml) or it warns/refuses -- 1.19 (the
    # unpinned latest) was 7 minors ahead and triggered a compatibility warning on every call.
    "qdrant-client>=1.13.0,<1.14.0",
    "metaphone>=0.6",
    "insightface>=0.7.3",
    "onnxruntime>=1.19.0",
    # Used at runtime by deliver_webhooks_activity (Phase 7), not just by tests -- previously a
    # dev-only dependency via FastAPI's TestClient/ASGITransport.
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    "boto3-stubs[s3]>=1.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header()/Query() *must* be called in argument defaults -- that's how
# its dependency injection works, not a mutable-default bug. Allowlisting it here is the
# standard fix rather than disabling B008 (which still catches real mutable-default bugs).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
# Bumped from 3.11: numpy's own type stubs (pulled in transitively via easyocr) use PEP 695
# `type` statement syntax, which mypy refuses to parse for any target below 3.12 -- this
# isn't a project preference, it's what the dependency actually requires.
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
