# SPA fallback: React Router owns client-side routes like /reviewer/queue that don't correspond
# to a real file on disk -- without this, a hard refresh or direct link to any route but "/"
# 404s at the web server instead of ever reaching React Router.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (dist/assets/*-<hash>.js) are safe to cache indefinitely -- a content
    # change always produces a new filename, so there's no staleness risk to trade off.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
