name: sentrilog

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentrilog
      POSTGRES_PASSWORD: sentrilog
      POSTGRES_DB: sentrilog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrilog -d sentrilog"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Was minio/minio + a minio/mc init job until Phase 12.1. Both images stopped being
  # pullable -- `minio/minio` and `minio/mc` return "pull access denied" on Docker Hub,
  # `quay.io/minio/*` returns "unauthorized", and bitnami/minio went behind a paid tier --
  # so a fresh `docker compose up` could no longer bring the stack up at all, and CI could
  # never have run the presigned-upload test. adobe/s3mock is Apache-2.0, 130MB against
  # MinIO's ~1GB-class image, starts in ~3s, and needs no init container because
  # `initialBuckets` creates the bucket for us.
  #
  # Verified against everything services/intake/storage.py actually does: presigned PUT,
  # presigned GET, head_object, get_object, and a 404 error code on a missing key (which is
  # the code object_exists() keys off -- a mock that returned NoSuchKey instead would make
  # object_exists raise rather than return False).
  #
  # Deliberately no volume: s3mock's `root`/`retainFilesOnExit` persistence returns
  # InternalError on every request under Docker Desktop's bind mounts, and local object
  # storage here only ever holds throwaway test uploads. Port 9000 on the host is MinIO's
  # old one, kept so existing .env files keep working; 9090 is s3mock's own HTTP port.
  s3:
    image: adobe/s3mock:4.9.0
    environment:
      initialBuckets: sentrilog-documents
    ports:
      - "9000:9090"
    healthcheck:
      # The image is a JRE base: no bash (so no /dev/tcp trick, unlike the qdrant check
      # above) and no curl, but it does ship wget. Asking Spring Boot's actuator confirms
      # the application is serving rather than just that the port is bound, and the Accept
      # header is required -- without it the actuator answers 406.
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Accept: application/json",
         "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: sentrilog
      POSTGRES_PWD: sentrilog
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    healthcheck:
      # auto-setup binds the frontend port to the container's own hostname/IP, not loopback --
      # "localhost" here would always fail. Use tctl against $(hostname) instead of a raw TCP probe
      # so the check verifies the gRPC service is actually serving, not just that a port is open.
      test: ["CMD-SHELL", "tctl --address \"$$(hostname):7233\" cluster health | grep -q SERVING"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    # The intake API and pipeline worker aren't containerized here (both are still run
    # locally, e.g. `uv run uvicorn services.intake.main:app`), so there's nothing in this
    # compose file for the frontend to depend_on -- it's a static build; connect to a running
    # API through its own /connect screen the same way the browser always has.

volumes:
  postgres_data:
  qdrant_data:
